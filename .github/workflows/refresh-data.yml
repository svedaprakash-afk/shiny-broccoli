name: Refresh data
on:
  schedule: [{ cron: '17 3 * * 1' }]   # weekly, Monday 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sources/osm.mjs
        continue-on-error: true
      - run: node scripts/sources/opendata-swiss.mjs
        continue-on-error: true
      - run: node scripts/sources/myswitzerland.mjs
        env: { MYSWITZERLAND_API_KEY: '${{ secrets.MYSWITZERLAND_API_KEY }}' }
        continue-on-error: true
      - run: node scripts/sources/municipal.mjs
        continue-on-error: true
      - run: node scripts/build.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || (git commit -m "chore: refresh activity data" && git push)
