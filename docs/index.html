<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids Activities Switzerland</title>
<meta name="description" content="Open directory of activities for children across Switzerland.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d52b1e'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <h1 id="title">Kids Activities Switzerland</h1>
  <div class="top">
    <label class="muted" for="ui-lang" hidden>Language</label>
    <select id="ui-lang" aria-label="Interface language"><option value="de">DE</option><option value="fr">FR</option><option value="it">IT</option><option value="en">EN</option></select>
    <button id="add" data-t="add">Add an activity</button>
  </div>
</header>
<main>
  <aside aria-label="Filters">
    <input id="q" type="search" placeholder="Search…" aria-label="Search">
    <fieldset><legend data-t="location">Location</legend>
      <div class="row"><button id="myloc" class="ghost" data-t="myloc">My location</button>
      <select id="city" aria-label="City"></select></div>
      <div class="row" style="margin-top:8px"><label for="radius"><span data-t="radius">Radius</span>: <b id="radius-out"></b></label>
      <input id="radius" type="range" min="0" max="100" step="5" value="0" style="width:100%"></div>
    </fieldset>
    <fieldset><legend data-t="cost">Cost</legend><div id="f-cost" class="chips"></div></fieldset>
    <fieldset><legend data-t="kind">Type</legend><div id="f-kind" class="chips"></div></fieldset>
    <fieldset><legend data-t="difficulty">Difficulty</legend><div id="f-diff" class="chips"></div></fieldset>
    <fieldset id="sport-box" hidden><legend data-t="sport">Sport</legend><div id="f-sport" class="chips"></div></fieldset>
    <fieldset><legend data-t="language">Language</legend><div id="f-lang" class="chips"></div></fieldset>
  </aside>
  <section aria-live="polite">
    <p class="muted" id="count"></p>
    <div id="list"></div>
    <button id="more" class="ghost" hidden>Show more</button>
  </section>
</main>
<footer class="muted"><span id="source-note"></span> <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors (ODbL)</a></footer>

<dialog id="dlg">
  <form id="sform" method="dialog">
    <h2 data-t="submitTitle">Suggest an activity</h2>
    <label><span data-t="name">Name</span><input name="name" required maxlength="120"></label>
    <label><span data-t="desc">Description</span><textarea name="description" maxlength="400" rows="3"></textarea></label>
    <div class="row">
      <label><span data-t="category">Category</span><select name="category"></select></label>
      <label><span data-t="cost">Cost</span><select name="cost"><option value="free">Free</option><option value="paid">Paid</option><option value="unknown">?</option></select></label>
      <label><span data-t="kind">Type</span><select name="kind"><option value="physical">Physical</option><option value="mental">Mental</option><option value="both">Both</option></select></label>
      <label><span data-t="difficulty">Difficulty</span><select name="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option><option value="unknown">?</option></select></label>
    </div>
    <label id="sport-row" hidden><span data-t="sportType">Type of sport</span><select name="sport"></select></label>
    <fieldset id="fee-row" hidden><legend data-t="fee">Fee (CHF)</legend>
      <div class="row"><label><span data-t="feeFrom">from</span><input name="feeMin" type="number" min="0" max="1000" step="0.5" style="width:6rem"></label>
      <label><span data-t="feeTo">to</span><input name="feeMax" type="number" min="0" max="1000" step="0.5" style="width:6rem"></label></div>
      <label><span data-t="feeNote">Price note</span><input name="feeNote" maxlength="120"></label></fieldset>
    <fieldset><legend data-t="address">Address</legend>
      <div class="row"><input name="address" maxlength="150" placeholder="Bahnhofstrasse 10, 8001 Zürich" style="flex:1;min-width:12rem" autocomplete="street-address">
      <button type="button" id="find" class="ghost" data-t="find">Find address</button></div>
      <select id="geo-matches" hidden aria-label="Address matches"></select>
      <p class="muted" id="geo-status" role="status"></p>
      <label><span data-t="city">City</span><input name="city" maxlength="60"></label>
      <details><summary class="muted" data-t="coordsAlt">Or enter coordinates</summary>
        <input name="coords" placeholder="47.37690, 8.54170" style="width:100%">
        <button type="button" id="here" class="ghost" data-t="pickhere" style="margin-top:6px">Use my location</button></details>
    </fieldset>
    <label><span data-t="website">Website</span><input name="url" type="url" maxlength="500"></label>
    <div class="row"><span data-t="ages">Age from / to</span><input name="minAge" type="number" min="0" max="18" style="width:5rem"><input name="maxAge" type="number" min="0" max="18" style="width:5rem"></div>
    <fieldset><legend data-t="langs">Languages</legend><div class="chips">
      <label><input type="checkbox" name="languages" value="de"><span>DE</span></label><label><input type="checkbox" name="languages" value="fr"><span>FR</span></label>
      <label><input type="checkbox" name="languages" value="it"><span>IT</span></label><label><input type="checkbox" name="languages" value="en"><span>EN</span></label></div></fieldset>
    <fieldset><legend data-t="photos">Add photos</legend>
      <label style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="addPhotos"><span data-t="photos">Add photos</span></label>
      <div id="photo-box" hidden>
        <p class="muted" data-t="photoHelp"></p>
        <label><span data-t="photoCredit">Photographer's name</span><input name="photoCredit" maxlength="120"></label>
        <label><span data-t="photoLicense">Licence</span><select name="photoLicense"><option>CC BY-SA 4.0</option><option>CC BY 4.0</option><option>CC0 1.0</option></select></label>
        <label style="flex-direction:row;gap:8px;align-items:flex-start"><input type="checkbox" name="photoRights"><span data-t="photoRights"></span></label>
      </div>
    </fieldset>
    <p class="muted" id="submitNote"></p>
    <div class="row"><button type="submit" data-t="send">Submit via GitHub</button><button type="button" id="cancel" class="ghost" data-t="cancel">Cancel</button></div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
